# Проект iOS-приложения RADI Team (генерируется XcodeGen на сборке в GitHub Actions)
name: RadiTeam
options:
  deploymentTarget:
    iOS: "15.0"
targets:
  RadiTeam:
    type: application
    platform: iOS
    sources: [RadiTeam]
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uz.radi.team
        PRODUCT_NAME: RadiTeam
        INFOPLIST_FILE: RadiTeam/Info.plist
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
