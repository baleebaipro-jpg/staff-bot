# Сборка iPhone-приложения RADI Team и отправка в TestFlight.
# Запуск вручную: GitHub → Actions → «iOS → TestFlight» → Run workflow.
# Нужные секреты (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID   — Team ID из developer.apple.com (Membership)
#   ASC_KEY_ID      — Key ID ключа App Store Connect API
#   ASC_ISSUER_ID   — Issuer ID (App Store Connect → Users and Access → Integrations → Keys)
#   ASC_KEY_P8      — содержимое файла AuthKey_XXXX.p8 целиком
name: iOS → TestFlight

on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Проверка секретов
        run: |
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID; do
            if [ -z "${!v}" ]; then echo "::error::Не задан секрет $v"; exit 1; fi
          done

      - name: Ключ App Store Connect API
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s' "$ASC_KEY_P8" > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Проект Xcode
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Сборка (archive)
        run: |
          cd ios
          xcodebuild -project RadiTeam.xcodeproj -scheme RadiTeam -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/RadiTeam.xcarchive archive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Отправка в TestFlight
        run: |
          cd ios
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath build/RadiTeam.xcarchive -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "✅ Сборка ${{ github.run_number }} отправлена в TestFlight — через 5–30 минут появится в App Store Connect."

      - name: Удалить ключ
        if: always()
        run: rm -rf "$HOME/private_keys"
